<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSINT Username Scanner</title>
    <style>
        :root {
            --bg-color: #050505;
            --terminal-green: #00ff66;
            --dark-green: #003311;
            --border-green: #008833;
            --text-dim: #00aa44;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--terminal-green);
            padding: 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            border: 1px solid var(--border-green);
            background-color: #000a02;
            padding: 20px;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.15);
            border-radius: 4px;
        }

        h1 {
            font-size: 1.3rem;
            text-align: center;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 5px var(--terminal-green);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            background-color: var(--bg-color);
            border: 1px solid var(--border-green);
            color: var(--terminal-green);
            padding: 12px;
            font-size: 1rem;
            border-radius: 2px;
            outline: none;
        }

        input:focus {
            border-color: var(--terminal-green);
            box-shadow: 0 0 8px rgba(0, 255, 102, 0.3);
        }

        button {
            background-color: var(--dark-green);
            border: 1px solid var(--terminal-green);
            color: var(--terminal-green);
            padding: 0 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 2px;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        button:active {
            background-color: var(--terminal-green);
            color: var(--bg-color);
        }

        #status {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 15px;
            min-height: 20px;
        }

        .results {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .result-item {
            background-color: rgba(0, 51, 17, 0.3);
            border-left: 3px solid var(--terminal-green);
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: var(--terminal-green);
            transition: background 0.2s;
            border-radius: 0 2px 2px 0;
        }

        .result-item:hover {
            background-color: rgba(0, 255, 102, 0.1);
        }

        .platform-name {
            font-weight: bold;
            font-size: 0.95rem;
        }

        .platform-link {
            font-size: 0.8rem;
            color: var(--text-dim);
            text-decoration: underline;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid var(--text-dim);
            border-top-color: var(--terminal-green);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>[ OSINT Scanner ]</h1>
        
        <div class="input-group">
            <input type="text" id="usernameInput" placeholder="Введите username..." autocomplete="off">
            <button onclick="startSearch()">Поиск</button>
        </div>

        <div id="status">Система готова к сканированию.</div>
        
        <div class="results" id="resultsContainer"></div>
    </div>

    <script>
        const BACKEND_URL = "https://project-m3fs.onrender.com";

        async function startSearch() {
            const username = document.getElementById('usernameInput').value.trim();
            const statusDiv = document.getElementById('status');
            const resultsContainer = document.getElementById('resultsContainer');

            resultsContainer.innerHTML = '';

            if (!username) {
                statusDiv.innerText = '[!] Ошибка: введите имя пользователя.';
                return;
            }

            statusDiv.innerHTML = '<span class="spinner"></span>Сканирование баз данных (первый запрос может занять до 30 сек)...';

            try {
                const response = await fetch(`${BACKEND_URL}/check?username=${encodeURIComponent(username)}`);
                
                if (!response.ok) {
                    throw new Error('Ошибка соединения с сервером');
                }

                const data = await response.json();
                
                if (data.found && data.found.length > 0) {
                    statusDiv.innerText = `[+] Найдено совпадений: ${data.found.length}`;
                    
                    data.found.forEach(item => {
                        const a = document.createElement('a');
                        a.href = item.url;
                        a.target = '_blank';
                        a.className = 'result-item';
                        a.innerHTML = `
                            <span class="platform-name">${item.name}</span>
                            <span class="platform-link">Открыть ↗</span>
                        `;
                        resultsContainer.appendChild(a);
                    });
                } else {
                    statusDiv.innerText = '[-] Совпадений не найдено.';
                }

            } catch (error) {
                console.error(error);
                statusDiv.innerText = '[!] Ошибка: сервер недоступен или просыпается.';
            }
        }
    </script>
</body>
</html>
